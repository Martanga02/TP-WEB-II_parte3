services:

  api:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: peliculas_db
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: peliculas_db
    volumes:
      - db_data:/var/lib/mysql
      - ./database/peliculas_db.sql:/docker-entrypoint-initdb.d/peliculas_db.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"

volumes:
  db_data:
